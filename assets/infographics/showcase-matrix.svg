<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" rx="32" fill="#081120"/>
  <rect x="24" y="24" width="1232" height="712" rx="28" fill="#0C1730"/>
  <text x="72" y="92" fill="#E8F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Showcase Matrix</text>
  <text x="72" y="130" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20">What each public repo is supposed to prove.</text>

  <rect x="72" y="168" width="1136" height="80" rx="18" fill="#13233B"/>
  <text x="104" y="216" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Repo</text>
  <text x="330" y="216" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Primary Proof</text>
  <text x="760" y="216" fill="#7ED7FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Why It Matters</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="266" width="1136" height="88" rx="18" fill="#0F1B32"/>
    <text x="104" y="318" fill="#E8F0FF" font-size="24" font-weight="700">nerdpos-showcase</text>
    <text x="330" y="308" fill="#E8F0FF" font-size="22">Cashier → payment → receipt → inventory/compliance</text>
    <text x="760" y="308" fill="#AEBEDB" font-size="20">Best ERP/POS proof point; fastest signal for real operations software.</text>

    <rect x="72" y="370" width="1136" height="88" rx="18" fill="#0F1B32"/>
    <text x="104" y="422" fill="#E8F0FF" font-size="24" font-weight="700">freshflow-showcase</text>
    <text x="330" y="412" fill="#E8F0FF" font-size="22">Orders, suppliers, purchasing, stabilization framing</text>
    <text x="760" y="412" fill="#AEBEDB" font-size="20">Shows broader ERP operations and collaboration credibility.</text>

    <rect x="72" y="474" width="1136" height="88" rx="18" fill="#0F1B32"/>
    <text x="104" y="526" fill="#E8F0FF" font-size="24" font-weight="700">devmurshid-showcase</text>
    <text x="330" y="516" fill="#E8F0FF" font-size="22">Agentic CLI workflow, roles, safety posture</text>
    <text x="760" y="516" fill="#AEBEDB" font-size="20">Shows serious developer-tooling direction, not just app UI work.</text>

    <rect x="72" y="578" width="1136" height="88" rx="18" fill="#0F1B32"/>
    <text x="104" y="630" fill="#E8F0FF" font-size="24" font-weight="700">nerdhris / nerdprm showcases</text>
    <text x="330" y="620" fill="#E8F0FF" font-size="22">HRIS foundation modules + Arabic-first AI project workflows</text>
    <text x="760" y="620" fill="#AEBEDB" font-size="20">Extend the brand into HR systems and productized AI execution tools.</text>
  </g>
</svg>
